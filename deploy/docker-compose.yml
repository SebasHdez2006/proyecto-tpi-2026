services:
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/etc/nginx/certs
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      app1:
        condition: service_started
      app2:
        condition: service_started
      app3:
        condition: service_started
    networks:
      - frontend
      - backend

  app1: &app
    build:
      context: ../backend
    env_file:
      - ./env/.env
    environment: &app-env
      NODE_ID: app1
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  app2:
    <<: *app
    environment:
      <<: *app-env
      NODE_ID: app2

  app3:
    <<: *app
    environment:
      <<: *app-env
      NODE_ID: app3

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./env/.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  frontend:
  backend:

volumes:
  postgres-data:
  redis-data:
